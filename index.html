<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShiftCraft</title>
<style>
/* Layout: top bar with tabs, then the active screen. Schedule = summary, day picker, timeline (4 am – 11 pm), unscheduled staff.
   System fonts only so it works offline. */
:root {
  --bg: #f2f4f7;
  --panel: #ffffff;
  --panel-2: #eef1f5;
  --line: #d9dee6;
  --grid: #e7ebf0;
  --grid-hour: #c9d0da;
  --fg: #1c2330;
  --muted: #5f6a7a;
  --accent: #1f6fd1;
  --accent-ink: #ffffff;
  --accent-soft: #e2edfb;
  --g-mgr: #5b6675;
  --g-sup: #183f73;
  --g-tm: #2c8ee6;
  --g-trn: #1f8a5c;
  --unsched: #fdf0cf;
  --good: #1d7a46;
  --warn: #a35f00;
  --bad: #b3261e;
  --font: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --mono: Consolas, "Cascadia Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --panel: #1a2029; --panel-2: #232a35; --line: #313a47; --grid: #242c37; --grid-hour: #3a4554;
    --fg: #e6eaf0; --muted: #98a3b3; --accent: #5aa2f5; --accent-ink: #0a1422; --accent-soft: #1d2d44;
    --g-mgr: #6c7787; --g-sup: #2f5f9e; --g-tm: #2f86d4; --g-trn: #2c9a6a; --unsched: #3d3420; --good: #5cc98b; --warn: #f0b04a; --bad: #f2756c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --panel: #1a2029; --panel-2: #232a35; --line: #313a47; --grid: #242c37; --grid-hour: #3a4554;
  --fg: #e6eaf0; --muted: #98a3b3; --accent: #5aa2f5; --accent-ink: #0a1422; --accent-soft: #1d2d44;
  --g-mgr: #6c7787; --g-sup: #2f5f9e; --g-tm: #2f86d4; --g-trn: #2c9a6a; --unsched: #3d3420; --good: #5cc98b; --warn: #f0b04a; --bad: #f2756c; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1 { font-size: 24px; font-weight: 600; margin: 0; }
h2 { font-size: 16px; margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
.inline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }

/* Bar */
.bar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 14px; padding: 8px 18px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
.brand-mark { display: grid; gap: 2px; }
.brand-mark i { display: block; height: 4px; border-radius: 2px; background: var(--g-tm); }
.brand-mark i:nth-child(1) { width: 14px; background: var(--g-mgr); margin-left: 2px; }
.brand-mark i:nth-child(2) { width: 18px; background: var(--g-sup); margin-left: 6px; }
.brand-mark i:nth-child(3) { width: 12px; }
.tabs { display: flex; gap: 2px; }
.tab { padding: 7px 14px; border: 0; border-radius: 7px; background: none; cursor: pointer; font-weight: 500; color: var(--muted); }
.tab:hover { background: var(--panel-2); }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.store { font-weight: 600; cursor: pointer; border-radius: 6px; padding: 4px 8px; }
.store:hover { background: var(--panel-2); }
.cell-note { font-size: 11px; color: var(--muted); white-space: normal; max-width: 150px; margin: 2px auto 0; line-height: 1.25; }
.problems ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; max-height: 50vh; overflow: auto; }
.problems li { display: flex; gap: 8px; align-items: baseline; }
.problems li.bad { color: var(--bad); }
.problems li.warn { color: var(--warn); }
.menubar { display: flex; gap: 1px; }
.menu { position: relative; }
.menu-btn { height: 30px; padding: 0 10px; border: 0; border-radius: 5px; background: none; cursor: pointer; }
.menu-btn:hover, .menu-btn[aria-expanded="true"] { background: var(--panel-2); }
.menu-list { position: absolute; top: calc(100% + 4px); left: 0; z-index: 90; min-width: 260px; padding: 5px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 30px rgba(0,0,0,.2); }
.menu-item { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center; width: 100%; padding: 7px 10px 7px 6px; border: 0; border-radius: 5px; background: none; text-align: left; cursor: pointer; white-space: nowrap; }
.menu-item:hover:not(:disabled), .menu-item:focus-visible { background: var(--accent); color: var(--accent-ink); outline: none; }
.menu-item:disabled { opacity: .45; cursor: default; }
.menu-item .mkey { font-size: 11.5px; opacity: .7; font-family: var(--mono); }
.menu-sep { height: 1px; background: var(--line); margin: 5px 4px; }
.theme-btn { width: 34px; height: 34px; padding: 0; }
.daytoggles { display: flex; gap: 2px; }
.daytoggles button { width: 26px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); cursor: pointer; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.daytoggles button.pt { width: 40px; }
.co-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 14px; }
.co-grid .field.wide { grid-column: 1 / -1; }
@media (max-width: 760px) { .co-grid { grid-template-columns: 1fr; } }
.co-h3 { margin: 16px 0 6px; font-size: 14px; }
.co-hours { display: grid; grid-template-columns: 170px auto auto; gap: 10px; align-items: center; justify-content: start; padding: 4px 0; }
/* Trained in: people by positions, with the position names written upwards */
table.trained { width: auto; }
table.trained td.nowrap { padding-right: 18px; }
table.trained th.vert { vertical-align: bottom; padding: 4px 2px; width: 34px; min-width: 34px; }
table.trained th.vert button { border: 0; background: none; padding: 0; cursor: pointer; color: inherit; font: inherit; }
table.trained th.vert span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; display: inline-block; max-height: 150px; overflow: hidden; text-overflow: ellipsis; font-weight: 600; font-size: 12px; }
table.trained th.vert button:hover span { color: var(--accent); }
table.trained td.tcell { padding: 2px; }
table.trained .tbox { width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: #fff; font-weight: 700; cursor: pointer; padding: 0; }
table.trained .tbox.on { background: var(--good); border-color: var(--good); }
table.trained .tbox:hover { border-color: var(--accent); }
table.trained tbody tr:hover td { background: var(--accent-soft); }
/* day-by-day availability cells (the same colours as the printed list) */
.input.need { border-color: var(--danger, #e03131); box-shadow: 0 0 0 1px var(--danger, #e03131) inset; }
.avcell { width: 100%; min-width: 74px; min-height: 30px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px; padding: 2px 4px; line-height: 1.15; }
.avcell.sys { opacity: 0.6; font-style: italic; }
.avcell.none { background: var(--panel); color: var(--muted); }
.avcell.on { background: #e2f0d9; color: #1c2330; }
.avcell.off { background: #111; color: #fff; }
.avcell.hl { background: #ffc000; color: #1c2330; }
.avcell:hover { outline: 2px solid var(--accent); }
.staff-tabs { margin: 10px 0 2px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
/* the staff table: compact time pickers so every column fits */
table.t .timepick { gap: 1px; flex-wrap: nowrap; }
table.t .timepick select.input { padding: 0 1px 0 4px; height: 28px; font-size: 12.5px; width: auto; min-width: 0; }
table.t td .inline { gap: 4px; }
table.t td .check.small { font-size: 12px; }
.daytoggles button.dt { min-width: 26px; width: auto; padding: 0 5px; }
.daytoggles button.dt.on { background: var(--bad); border-color: var(--bad); color: #fff; }
.daytoggles button.pt.on { background: var(--good); border-color: var(--good); color: #fff; }
.chip.na { opacity: .6; border-style: dashed; }
.chip.na small::after { content: " · not available"; color: var(--bad); font-weight: 600; }
.shift .w.na { background: #ffb3a8; color: #4a0d06; }
.crash { position: fixed; top: 0; left: 0; right: 0; z-index: 9999; background: #fde2e0; color: #4a0d06; padding: 12px 18px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font: 14px system-ui, sans-serif; }
.crash button { padding: 6px 12px; border: 1px solid #b3261e; background: #fff; border-radius: 6px; cursor: pointer; }
.month-pick { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; color: var(--muted); }
.month-pick .input { height: 30px; color: var(--fg); font-weight: 600; }
.weekout { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.weekout > span { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 2px; }
.ctx-menu { position: fixed; z-index: 120; min-width: 210px; padding: 5px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
.ctx-menu .ctx-head { padding: 6px 10px 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.ctx-menu button { display: block; width: 100%; padding: 7px 10px; border: 0; border-radius: 5px; background: none; text-align: left; cursor: pointer; }
.ctx-menu button:hover, .ctx-menu button:focus-visible { background: var(--accent); color: var(--accent-ink); outline: none; }
.ctx-menu button.danger:hover { background: var(--bad); color: #fff; }
.shift .tk.nt { background: #fff3b0; color: #4a3a00; }
.shift-note { position: absolute; height: 19px; line-height: 19px; padding: 0 7px; background: #fff27a; color: #2e2600; font-size: 12px; text-align: justify; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; box-shadow: inset 0 -2px 0 rgba(0,0,0,.08); }
.shift-note b { letter-spacing: .04em; }
.shift-note:hover { outline: 2px solid var(--accent); }
.docname { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 13px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); cursor: pointer; white-space: nowrap; font-weight: 500; }
.btn:hover:not(:disabled) { background: var(--panel-2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.07); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { height: 28px; padding: 0 9px; font-size: 13px; }
.btn.icon { width: 38px; padding: 0; font-size: 18px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.danger-text { color: var(--bad); }
.input { height: 34px; padding: 0 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); min-width: 0; }
input.input.num { text-align: right; }
textarea.input { height: auto; padding: 8px; resize: vertical; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }

/* Page */
.main { padding: 18px; max-width: 1700px; margin: 0 auto; display: grid; gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }

/* Summary tiles */
.summary { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
.tile { padding: 10px 18px; border-right: 1px solid var(--line); min-width: 130px; }
.tile:last-child { border-right: 0; }
.tile span { display: block; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.tile b { font-size: 20px; font-variant-numeric: tabular-nums; }

/* Day picker */
.daynav { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.daynav h1 { min-width: 290px; text-align: center; }
.weeks { display: flex; gap: 4px; flex-wrap: wrap; }
.days { display: grid; grid-template-columns: repeat(7, minmax(72px, 1fr)); gap: 6px; }
.day { display: grid; gap: 1px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; text-align: left; }
.day:hover { border-color: var(--accent); }
.day[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.day b { font-size: 13px; }
.day small { font-size: 11.5px; opacity: .8; font-variant-numeric: tabular-nums; }

/* Timeline */
.tl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.tl { position: relative; min-width: max-content; user-select: none; }
.tl-row { display: grid; grid-template-columns: var(--label-w) var(--lanes-w); border-bottom: 1px solid var(--line); }
.tl-row:last-child { border-bottom: 0; }
.tl-label { position: sticky; left: 0; z-index: 3; background: var(--panel); border-right: 1px solid var(--line); padding: 8px 10px; font-weight: 600; display: grid; align-content: start; gap: 2px; }
.tl-label small { font-weight: 400; color: var(--muted); font-size: 12px; }
.tl-head .tl-label { font-weight: 700; }
.hours { position: relative; height: 34px; }
.hours span { position: absolute; top: 7px; font-weight: 700; font-size: 13px; padding-left: 5px; border-left: 1px solid var(--grid-hour); height: 27px; }
.lanes { position: relative; background-image: repeating-linear-gradient(to right, var(--grid-hour) 0 1px, transparent 1px var(--hour-w)), repeating-linear-gradient(to right, var(--grid) 0 1px, transparent 1px var(--q-w)); min-height: 40px; }
.shift { position: absolute; height: 26px; border-radius: 4px; color: #fff; font-size: 12.5px; display: flex; align-items: center; gap: 6px; padding: 0 9px; white-space: nowrap; overflow: hidden; cursor: grab; box-shadow: 0 1px 2px rgba(0,0,0,.2); touch-action: none; }
.shift:active { cursor: grabbing; }
.shift.mgr { background: var(--g-mgr); } .shift.sup { background: var(--g-sup); } .shift.tm { background: var(--g-tm); } .shift.trn { background: var(--g-trn); }
.shift .tk { background: rgba(255,255,255,.92); color: #123; border-radius: 3px; padding: 0 5px; font-size: 11px; font-weight: 700; }
.sec-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; margin-top: 10px; }
.sec-hours td:first-child, .sec-hours th { white-space: nowrap; }
.sec-hours h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
table.t.compact th, table.t.compact td { padding: 4px 8px; }
table.t tr.off td { color: var(--muted); }
.totals { margin-top: 14px; }
.task-list { display: grid; gap: 6px; max-height: 46vh; overflow: auto; }
.task { display: grid; grid-template-columns: 18px 1fr 150px 90px 32px; gap: 8px; align-items: center; }
.task.done .input:first-of-type { text-decoration: line-through; color: var(--muted); }
.task-add { display: grid; grid-template-columns: 1fr 200px auto; gap: 8px; }
#print-area { display: none; }
.person-sheet { background: #fff; color: #000; font-family: Arial, Helvetica, sans-serif; }
.person-sheet .ps-head { display: flex; justify-content: space-between; align-items: end; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 12px; }
.person-sheet h1 { font-size: 26px; margin: 2px 0; }
.person-sheet .ps-place { font-weight: 700; color: #444; }
.person-sheet .ps-range { text-align: right; font-weight: 700; }
.person-sheet table.t th { background: #222; color: #fff; border-color: #222; }
.person-sheet table.t td { border-color: #999; white-space: pre-line; }
.person-sheet table.t tr.off td { color: #777; }
.person-sheet table.t tr.wk td { font-weight: 700; background: #eee; }
.person-sheet table.t tfoot td { background: #eee; }
.person-sheet .ps-tasks h2 { font-size: 15px; margin: 16px 0 6px; }
.person-sheet .ps-tasks ul { margin: 0; padding-left: 4px; list-style: none; line-height: 1.7; }
.person-sheet .ps-sign { margin-top: 18px; font-weight: 700; }
.person-sheet .ps-lines { height: 110px; background: repeating-linear-gradient(to bottom, transparent 0 26px, #bbb 26px 27px); }
.shift .t { opacity: .85; font-variant-numeric: tabular-nums; }
.shift .w { background: #ffd34d; color: #3a2a00; border-radius: 3px; padding: 0 4px; font-weight: 700; font-size: 11px; }
.shift .edge { position: absolute; top: 0; bottom: 0; width: 9px; cursor: ew-resize; }
.shift .edge.l { left: 0; } .shift .edge.r { right: 0; }
.shift .edge::after { content: ""; position: absolute; top: 7px; bottom: 7px; left: 3px; width: 3px; border-left: 1px solid rgba(255,255,255,.6); border-right: 1px solid rgba(255,255,255,.6); opacity: 0; }
.shift:hover .edge::after { opacity: 1; }
.shift.dragging { opacity: .9; outline: 2px solid var(--fg); z-index: 5; }
.drag-tip { position: fixed; z-index: 200; background: var(--fg); color: var(--panel); padding: 4px 8px; border-radius: 5px; font-size: 12.5px; pointer-events: none; font-variant-numeric: tabular-nums; }
.unsched { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; }
.chip { padding: 5px 10px; border-radius: 5px; background: var(--unsched); border: 1px solid color-mix(in srgb, var(--unsched) 70%, var(--fg)); cursor: pointer; font-size: 13px; }
.chip:hover { outline: 2px solid var(--accent); }
.chip small { color: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }

/* Tables */
.table-wrap { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.t th, table.t td { padding: 7px 10px; border: 1px solid var(--line); }
table.t th { background: var(--panel-2); font-weight: 600; text-align: left; white-space: nowrap; }
table.t td.c { text-align: center; }
table.t tfoot td { font-weight: 700; background: var(--panel-2); }
table.t .in { width: 110px; text-align: right; }
table.t td.cellbtn { cursor: pointer; white-space: nowrap; }
table.t td.cellbtn:hover { background: var(--accent-soft); }
table.t tr.grp td { background: var(--panel-2); font-weight: 700; }
td.fc { background: color-mix(in srgb, var(--unsched) 60%, transparent); }
.hint { margin: 0; color: var(--muted); font-size: 12.5px; }
.cols2 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }

/* Dialog */
.backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(10, 15, 25, .45); display: grid; place-items: center; padding: 16px; }
.dialog { width: min(440px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.dialog.wide { width: min(640px, 100%); }
.dialog h2 { font-size: 18px; }
.dialog-body { display: grid; gap: 12px; }
.dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.timepick { display: flex; gap: 4px; align-items: center; }
.timepick select { width: auto; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 150; display: flex; gap: 12px; align-items: center; background: var(--fg); color: var(--panel); padding: 9px 14px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.toast button { background: none; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; filter: brightness(1.4); }
.handoff-text { font-family: var(--mono); font-size: 13px; white-space: pre; }

@media print {
  :root {
    --bg: #ffffff !important; --panel: #ffffff !important; --panel-2: #eef1f5 !important; --line: #d9dee6 !important;
    --grid: #e7ebf0 !important; --grid-hour: #c9d0da !important; --fg: #1c2330 !important; --muted: #5f6a7a !important;
    --accent: #1f6fd1 !important; --accent-ink: #ffffff !important; --accent-soft: #e2edfb !important;
    --g-mgr: #5b6675 !important; --g-sup: #183f73 !important; --g-tm: #2c8ee6 !important; --g-trn: #1f8a5c !important;
    --unsched: #fdf0cf !important; --good: #1d7a46 !important; --warn: #a35f00 !important; --bad: #b3261e !important;
    color-scheme: light !important;
  }
  body.print-people > *:not(#print-area) { display: none !important; }
  body.print-people #print-area { display: block !important; }
  .person-sheet { break-after: page; page-break-after: always; }
  .person-sheet:last-child { break-after: auto; page-break-after: auto; }

  // Drag to move, drag edges to resize; click removes, double-click edits.
  let lastClick = { id: null, t: 0 }, clickTimer = null;
  function attachDrag(bar, s, d, pxPerMin) {
    bar.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      const mode = e.target.classList.contains('l') ? 'l' : e.target.classList.contains('r') ? 'r' : 'm';
      const sx = e.clientX, o = { start: s.start, end: s.end };
      let moved = false, tip = null;
      bar.setPointerCapture(e.pointerId);
      const move = (ev) => {
        const dm = snap((ev.clientX - sx) / pxPerMin);
        if (!moved && Math.abs(ev.clientX - sx) < 4) return;
        moved = true; bar.classList.add('dragging');
        let ns = o.start, ne = o.end;
        if (mode === 'm') { const l = o.end - o.start; ns = Math.max(DAY_START, Math.min(DAY_END - l, o.start + dm)); ne = ns + l; }
        if (mode === 'l') ns = Math.max(DAY_START, Math.min(o.end - STEP, o.start + dm));
        if (mode === 'r') ne = Math.min(DAY_END, Math.max(o.start + STEP, o.end + dm));
        bar.style.left = (ns - DAY_START) * pxPerMin + 'px'; bar.style.width = (ne - ns) * pxPerMin + 'px';
        if (bar._note) { bar._note.style.left = (ns - DAY_START) * pxPerMin + 8 + 'px'; bar._note.style.width = Math.max(40, (ne - ns) * pxPerMin - 16) + 'px'; }
        bar.querySelector('.t').textContent = `${clock(ns, true)}–${clock(ne, true)}`;
        bar._next = { start: ns, end: ne };
        if (!tip) { tip = h('div', { class: 'drag-tip' }); document.body.append(tip); }
        tip.textContent = `${clock(ns)} – ${clock(ne)} · ${hrs((ne - ns) / 60)} h`;
        tip.style.left = ev.clientX + 12 + 'px'; tip.style.top = ev.clientY - 34 + 'px';
      };
      const up = () => {
        bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); bar.removeEventListener('pointercancel', up);
        tip && tip.remove();
        if (moved) {
          const n = bar._next;
          if (n && (n.start !== s.start || n.end !== s.end)) change(() => { s.start = n.start; s.end = n.end; });
          else render();
          return;
        }
        // A click: wait briefly to see if it becomes a double-click.
        const now = Date.now();
        if (lastClick.id === s.id && now - lastClick.t < 320) { clearTimeout(clickTimer); lastClick = { id: null, t: 0 }; editShift(d, s.id); return; }

      bar.addEventListener('pointermove', move); bar.addEventListener('pointerup', up); bar.addEventListener('pointercancel', up);
    });

    bar.addEventListener('contextmenu', (e) => { e.preventDefault(); clearTimeout(clickTimer); lastClick = { id: null, t: 0 }; shiftMenu(e.clientX, e.clientY, d, s.id); });

  // ===================================================================
  // Checking: clean up files, and find problems in the schedule
  // ===================================================================
  // Fixes anything that could break the schedule (bad times, missing ids). Returns how many fixes.
  function validatePlan(p) {
    let fixes = 0;
    if (!Array.isArray(p.positions)) p.positions = defaultPositions();
    p.positions = p.positions.filter((x) => x && String(x.name || '').trim()).map((x) => ({ id: x.id || uid(), name: String(x.name).trim(), active: x.active !== false }));
    const ids = new Set();
    p.staff = (p.staff || []).filter((x) => x && String(x.name || '').trim()).map((x) => {
      const q = { ...x, name: String(x.name).trim() };
      if (!ROLES[q.role]) { q.role = 'TM'; fixes++; }
      if (!q.id || ids.has(q.id)) { q.id = uid(); fixes++; }
      ids.add(q.id);
      return q;
    });
    Object.keys(p.shifts || {}).forEach((d) => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || !Array.isArray(p.shifts[d])) { delete p.shifts[d]; fixes++; return; }
      p.shifts[d] = p.shifts[d].filter((s) => s && s.staffId).map((s) => {
        const t = { ...s, start: snap(+s.start), end: snap(+s.end) };
        if (!isFinite(t.start) || !isFinite(t.end)) { t.start = 540; t.end = 1020; fixes++; }
        const before = t.start + ':' + t.end;
        clampShift(t);
        if (before !== t.start + ':' + t.end) fixes++;
        if (!t.id) { t.id = uid(); fixes++; }
        if (t.note != null) { const n = String(t.note).trim().slice(0, 500); if (n !== t.note) fixes++; if (n) t.note = n; else delete t.note; }
        return t;
      });
    });
    return fixes;
  }
  function problemsFor(days) {
    const out = [];
    const add = (d, text, kind) => out.push({ d, text, kind });
    days.forEach((d) => {
      const list = shiftsOn(d);
      const seen = {};
      list.forEach((s) => {
        const p = staffById(s.staffId);
        if (seen[p.id]) add(d, `${p.name} is scheduled twice (${clock(seen[p.id].start)}–${clock(seen[p.id].end)} and ${clock(s.start)}–${clock(s.end)}).`, 'bad');
        seen[p.id] = s;
        if (!p.active) add(d, `${p.name} is scheduled but marked not active on the Staff tab.`, 'warn');
        const iss = availIssue(p, d, s);
        if (iss) add(d, iss + '.', 'warn');
        if (len(s) > 10) add(d, `${p.name} has a ${hrs(len(s))}-hour shift.`, 'warn');
      });
      // Leadership on the floor: someone from Manager or Supervisor whenever anyone is working.
      if (list.length) {
        let gap = null;
        const gaps = [];
        for (let m = DAY_START; m <= DAY_END; m += STEP) {
          const on = list.filter((s) => s.start <= m && s.end > m);
          const lead = on.some((s) => ['mgr', 'sup'].includes(ROLES[staffById(s.staffId).role].group));
          if (on.length && !lead && m < DAY_END) { if (gap == null) gap = m; }
          else if (gap != null) { gaps.push([gap, m]); gap = null; }
        }
        gaps.forEach(([a, b]) => add(d, `No manager or shift manager on the floor ${clock(a)}–${clock(b)}.`, 'bad'));
      }
    });
    // Weekly hours over each person's maximum
    const weeksSeen = new Set(days.map((d) => mondayOf(d)));
    weeksSeen.forEach((mon) => {
      const wd = daysFrom(mon, 7);
      plan.staff.forEach((p) => {
        const t = wd.reduce((a, d) => a + hoursOn(p.id, d), 0);
        if (p.maxHours && t > p.maxHours) add(mon, `${p.name} has ${hrs(t)} hours in the week of ${shortDate(mon)} (max ${p.maxHours}).`, 'warn');
      });
    });
    return out.sort((a, b) => a.d.localeCompare(b.d));
  }
  function checkDialog() {
    const range = h('select', { class: 'input' }, h('option', { value: 'day' }, `This day (${dayName(ui.day, 'short')} ${shortDate(ui.day)})`), h('option', { value: 'week', selected: true }, `This week (week ${weekOf(ui.day) + 1})`), h('option', { value: 'all' }, `Whole plan (${plan.weeks} weeks)`));
    const list = h('div', { class: 'problems' });
    const draw = () => {
      const days = range.value === 'day' ? [ui.day] : range.value === 'week' ? weekDays(weekOf(ui.day)) : planDays();
      const probs = problemsFor(days);
      list.replaceChildren(probs.length
        ? h('ul', null, probs.map((x) => h('li', { class: x.kind }, h('button', { class: 'btn sm', type: 'button', onclick: () => { ui.day = planDays().includes(x.d) ? x.d : ui.day; ui.tab = 'schedule'; persist(); document.querySelector('.backdrop')?.remove(); render(); } }, `${dayName(x.d, 'short')} ${shortDate(x.d)}`), ' ', x.text)))

    range.addEventListener('change', draw); draw();
    modal({ title: 'Check schedule', wide: true, body: [h('label', { class: 'field' }, h('span', null, 'Check'), range), list,

  const notesFor = (days) => days.flatMap((d) => shiftsOn(d).filter((s) => s.note).sort((a, b) => a.start - b.start).map((s) => ({ d, s, p: staffById(s.staffId) })));
  // Writes the notes on ruled lines, then leaves the rest of the lines blank for handwriting.
  function drawNotes(text, line, list, M, CW, y, bottom, inch, pt, gap = 0.3) {

      line(M, ly, M + CW, ly, 0.5, '#bbb');

  // ===================================================================

    return { app: 'ShiftCraft', kind: 'weeks', version: 5, company: plan.company, location: plan.location, splh: plan.splh,

      people: plan.staff.filter((p) => used.has(p.id)).map((p) => ({ id: p.id, name: p.name, role: p.role })),

      forecast: Object.fromEntries(days.filter((d) => plan.forecast[d] != null && plan.forecast[d] !== '').map((d) => [d, plan.forecast[d]])),

  // ===================================================================
  // Text and CSV export
  // ===================================================================
  function weekText(w) {
    const days = weekDays(w);
    const out = [`${[plan.company, plan.location].filter(Boolean).join(' - ')}`, `Week of ${longDate(days[0])} - ${longDate(days[6])}`, ''];
    days.forEach((d) => {
      out.push(`${longDate(d).toUpperCase()}   (${hrs(dayHours(d))} h scheduled, forecast ${money(forecastOf(d))}, target ${targetHours(d) == null ? '-' : hrs(targetHours(d))} h)`);
      const list = shiftsOn(d).map((s) => ({ s, p: staffById(s.staffId) }))
        .sort((a, b) => GROUPS.findIndex((g) => g[0] === ROLES[a.p.role].group) - GROUPS.findIndex((g) => g[0] === ROLES[b.p.role].group) || a.s.start - b.s.start);
      if (!list.length) out.push('  (nobody scheduled)');
      list.forEach((x) => out.push(`  ${GROUPS.find((g) => g[0] === ROLES[x.p.role].group)[1].padEnd(12)} ${x.p.name.padEnd(24)} ${ROLES[x.p.role].short.padEnd(4)} ${clock(x.s.start).padStart(8)} - ${clock(x.s.end).padStart(8)}  ${hrs(len(x.s)).padStart(5)} h${x.s.note ? '   Note: ' + x.s.note : ''}`));
      out.push('');
    });
    out.push('HOURS THIS WEEK');
    sortStaff(plan.staff).forEach((p) => { const t = personWeekHours(p.id, w); if (t) out.push(`  ${p.name.padEnd(24)} ${hrs(t).padStart(5)} h${p.maxHours && t > p.maxHours ? `  OVER MAX (${p.maxHours})` : ''}`); });
    return out.join('\r\n');
  }
  function csvRows(weeks) {
    const cell = (v) => { const s = String(v ?? ''); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const rows = [['Date', 'Day', 'Job group', 'Name', 'Role', 'Start', 'Finish', 'Hours', 'Note']];
    weeks.forEach((w) => weekDays(w).forEach((d) => shiftsOn(d).map((s) => ({ s, p: staffById(s.staffId) }))
      .sort((a, b) => a.s.start - b.s.start)
      .forEach((x) => rows.push([usDate(d), dayName(d), GROUPS.find((g) => g[0] === ROLES[x.p.role].group)[1], x.p.name, ROLES[x.p.role].label, clock(x.s.start), clock(x.s.end), hrs(len(x.s)), x.s.note || '']))));
    return '﻿' + rows.map((r) => r.map(cell).join(',')).join('\r\n') + '\r\n';
  }

  // ===================================================================
  // Week sheet image (for printing and marking up)
  // ===================================================================
  const PAPERS = { letter: [8.5, 11, 'Letter 8.5 × 11 in'], legal: [8.5, 14, 'Legal 8.5 × 14 in'], tabloid: [11, 17, 'Tabloid 11 × 17 in'] };
  function drawWeekSheet(w, o) {
    let [pw, ph] = PAPERS[o.paper];
    if (o.orient === 'landscape') [pw, ph] = [ph, pw];
    const dpi = o.dpi, W = Math.round(pw * dpi), H = Math.round(ph * dpi);
    const c = makeSurface(W, H, o);
    const g = c.getContext('2d');
    const pt = (n) => n / 72 * dpi, inch = (n) => n * dpi;
    const font = (size, weight = '400') => `${weight} ${pt(size)}px Arial, Helvetica, sans-serif`;
    g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#000'; g.textBaseline = 'alphabetic';
    const M = inch(0.45), CW = W - 2 * M;
    const days = weekDays(w);
    let y = M + pt(18);
    g.font = font(20, '700'); g.fillText([plan.company, plan.location].filter(Boolean).join(' – ') || 'Schedule', M, y);
    g.font = font(10); g.textAlign = 'right'; g.fillStyle = '#444';
    g.fillText(`Printed ${new Date().toLocaleDateString()}`, W - M, y);
    if (placeLine()) g.fillText(placeLine(), W - M, y + pt(16));
    g.textAlign = 'left'; g.fillStyle = '#000';
    y += pt(20);
    g.font = font(13, '700'); g.fillText(`Week of ${longDate(days[0])} – ${longDate(days[6])}`, M, y);
    y += pt(14);

    const staff = sortStaff(plan.staff.filter((p) => p.active || days.some((d) => shiftsOn(d).some((s) => s.staffId === p.id))));
    const rows = []; let last = null;
    staff.forEach((p) => { const gk = ROLES[p.role].group; if (gk !== last) { rows.push({ t: 'g', label: GROUPS.find((x) => x[0] === gk)[1] }); last = gk; } rows.push({ t: 'p', p }); });
    const weekTotal = (fn) => days.reduce((a, d) => a + (fn(d) || 0), 0);
    const foot = [
      ['Scheduled hours', (d) => hrs(dayHours(d)), hrs(weekTotal(dayHours))],
      ['Forecast', (d) => money(forecastOf(d)), money(weekTotal(forecastOf))],
      ['Target hours', (d) => (targetHours(d) == null ? '—' : hrs(targetHours(d))), hrs(weekTotal(targetHours))],
      ['Hours variance', (d) => (varianceHours(d) == null ? '—' : signed(varianceHours(d))), signed(weekTotal(dayHours) - weekTotal(targetHours))],
    ];
    const headH = pt(30);
    const noteList = notesFor(days);
    let notesH = o.notes || noteList.length ? Math.max(inch(1.2), inch(0.32) * (noteList.length + 1.6)) : 0;
    let avail = H - M - y - notesH - headH;
    const n = rows.length + foot.length;
    let rowH = Math.min(inch(0.45), Math.max(inch(0.24), avail / Math.max(1, n)));
    if (rowH * n > avail && notesH && !noteList.length) { notesH = 0; avail = H - M - y - headH; rowH = Math.min(inch(0.45), avail / n); }
    if (rowH * n > avail) rowH = avail / n;
    if (o.notes && notesH === 0 && H - M - (y + headH + rowH * n) > inch(0.6)) notesH = H - M - (y + headH + rowH * n) - inch(0.1);
    else if ((o.notes || noteList.length) && notesH) notesH = Math.max(notesH, H - M - (y + headH + rowH * n) - inch(0.1));
    const nameW = CW * (o.orient === 'portrait' ? 0.22 : 0.2), hoursW = CW * 0.07, dayW = (CW - nameW - hoursW) / 7;
    // Text size follows the row height, but never so big that "10:30a–11:45p" overflows a day column.
    const cellPt = Math.max(6, Math.min(11, rowH / dpi * 72 * 0.42, dayW / dpi * 72 / 8.6));
    const colX = (i) => M + nameW + i * dayW;
    const line = (x1, y1, x2, y2, wpt = 0.5, col = '#888') => { g.strokeStyle = col; g.lineWidth = pt(wpt); g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); };
    const text = (s, x, yy, align = 'left', size = cellPt, weight = '400', col = '#000', maxW) => {

  .crb-small svg { width: 17px; height: 17px; flex: none; }
  .crb-icon { position: relative; justify-content: center; width: 28px; height: 27px; padding: 0; }
  .crb-big svg.ink, .crb-small svg.ink, .crb-small.crb-icon svg { stroke: currentColor; }
  .crb-small.crb-icon svg .hue { stroke: var(--hue); }
  .crb-big svg, .crb-small svg { fill: none; stroke: var(--hue); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .crb-big svg .fill, .crb-small svg .fill { fill: var(--hue-soft); }
  .crb-big:hover, .crb-small:hover { background: var(--hue-soft); }
  .crb-big[aria-pressed="true"], .crb-small[aria-pressed="true"] { background: var(--hue-soft); color: var(--hue); }
  .crb-big:disabled, .crb-small:disabled { opacity: .45; cursor: default; background: transparent; }
  .crb-el { display: flex; align-items: center; }
  @media print { .ctb, .crb, .ctb-mega, .ctb-pop { display: none !important; } }`;
      document.head.append(s);
    }

    // ---------- The logo menu: every classic menu side by side ----------
    function megaMenu(btn, menus) {
      let open = null;
      const close = () => { if (!open) return; open.remove(); open = null; btn.setAttribute('aria-expanded', 'false'); };
      function show() {
        if (open) { close(); return; }
        open = mk('div', 'ctb-mega'); open.setAttribute('role', 'menu');
        menus().filter((m) => !m[2] || m[2]()).forEach(([name, items]) => {
          const col = mk('div'); col.append(mk('h4', null, name));
          items.forEach((it) => {
            if (!it) return;
            if (it === '-') { col.append(mk('hr')); return; }
            if (it.heading) { col.append(mk('div', 'ctb-mh', it.heading)); return; }
            const b = mk('button', 'ctb-mi'); b.type = 'button'; b.setAttribute('role', 'menuitem');
            const on = !!(it.checked && it.checked());
            b.append(mk('span', null, on ? '✓' : ''), mk('span', null, typeof it.label === 'function' ? it.label() : it.label), mk('kbd', null, it.key || ''));
            b.disabled = !!(it.disabled && it.disabled());
            b.addEventListener('click', () => { close(); it.run(); });
            col.append(b);
          });
          open.append(col);
        });
        document.body.append(open);
        const r = btn.getBoundingClientRect();
        open.style.top = (r.bottom + 6) + 'px';
        open.style.left = Math.max(8, Math.min(r.left, innerWidth - open.offsetWidth - 8)) + 'px';
        btn.setAttribute('aria-expanded', 'true');
        open.addEventListener('keydown', (e) => {
          const all = [...open.querySelectorAll('.ctb-mi:not(:disabled)')], i = all.indexOf(document.activeElement);
          if (e.key === 'ArrowDown') { e.preventDefault(); all[(i + 1) % all.length].focus(); }
          if (e.key === 'ArrowUp') { e.preventDefault(); all[(i - 1 + all.length) % all.length].focus(); }
        });
        open.querySelector('.ctb-mi:not(:disabled)')?.focus();
      }
      btn.addEventListener('click', show);
      document.addEventListener('mousedown', (e) => { if (open && !open.contains(e.target) && !btn.contains(e.target)) close(); });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && open) { close(); btn.focus(); }
        if (e.key === 'F10') { e.preventDefault(); show(); }
      });
      window.addEventListener('blur', close);
      return { show, close };
    }

    // =====================================================================
    // Title bar
    // =====================================================================
    window.CraftTitlebar = function (cfg) {
      const bar = mk('div', 'ctb');
      bar.setAttribute('role', 'banner');
      if (cfg.colors) { bar.style.setProperty('--ctb-a', cfg.colors[0]); bar.style.setProperty('--ctb-b', cfg.colors[1] || cfg.colors[0]); }
      const key = (cfg.storageKey || 'craft');

      // Left: logo (opens the menus) or the app's own elements, then the quick buttons
      const left = mk('div', 'ctb-left');
      if (cfg.logo) {
        const logo = mk('button', 'ctb-logo'); logo.type = 'button';
        logo.innerHTML = cfg.logo;
        logo.title = `${cfg.appName} menus: ${(cfg.menus ? cfg.menus().map((m) => m[0]).join(', ') : '')} (F10)`;
        logo.setAttribute('aria-label', `${cfg.appName} menus`); logo.setAttribute('aria-haspopup', 'true');
        left.append(logo);
        if (cfg.menus) megaMenu(logo, cfg.menus);
      }
      (cfg.leftEls || []).filter(Boolean).forEach((e) => left.append(e));
      if (!cfg.logo && !(cfg.leftEls || []).length) left.append(mk('span', 'ctb-app', cfg.appName));
      const quickWrap = mk('div', 'ctb-left');
      left.append(mk('span', 'ctb-sep'), quickWrap);

      // People can hide built-in quick buttons and add any command (kept in this browser).
      let custom = store.get(key + '-quick', { hide: [], add: [] });
      const saveCustom = () => store.set(key + '-quick', custom);
      let quickBtns = [];
      function renderQuick() {
        quickWrap.textContent = '';
        quickBtns = [];
        const add = (q, text) => {
          const b = mk('button', 'ctb-q' + (text ? ' text' : '')); b.type = 'button';
          b.innerHTML = q.icon ? svg(q.icon) : '';
          if (text) b.append(document.createTextNode(q.short || q.title));
          b.title = q.title + (q.key ? ` (${q.key})` : '') + ' · right-click to remove';
          b.setAttribute('aria-label', q.title);
          b.addEventListener('mousedown', (e) => e.preventDefault());   // keep the selection where it is
          b.addEventListener('click', () => q.run());
          b.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (q.builtIn) custom.hide = [...new Set([...custom.hide, q.title])]; else custom.add = custom.add.filter((x) => x !== q.title);
            saveCustom(); renderQuick();
            cfg.toast && cfg.toast(`Removed “${q.title}” from the top bar. Use ⌄ to add it back.`);
          });
          quickWrap.append(b);
          quickBtns.push([b, q]);
        };
        (cfg.quick || []).filter((q) => !custom.hide.includes(q.title)).forEach((q) => add({ ...q, builtIn: true }));
        const all = commands();
        custom.add.forEach((label) => {
          const c = all.find((x) => x.label === label);
          if (c) add({ title: c.label, short: c.label.replace(/…$/, '').slice(0, 18), icon: c.icon || '', key: c.key, run: c.run, disabled: c.disabled }, !c.icon);
        });
        const more = mk('button', 'ctb-q ctb-more'); more.type = 'button';
        more.innerHTML = svg('more'); more.title = 'Customize the quick buttons'; more.setAttribute('aria-label', 'Customize the quick buttons');
        more.addEventListener('click', () => customize(more));
        quickWrap.append(more);
        update();
      }
      let pop = null;
      function closePop() { if (pop) { pop.remove(); pop = null; } }
      function customize(btn) {
        if (pop) { closePop(); return; }
        pop = mk('div', 'ctb-pop');
        pop.append(mk('h6', null, 'Quick buttons'));
        (cfg.quick || []).forEach((q) => {
          const row = mk('label', 'ctb-row');
          const box = mk('input'); box.type = 'checkbox'; box.checked = !custom.hide.includes(q.title);
          box.addEventListener('change', () => { custom.hide = box.checked ? custom.hide.filter((x) => x !== q.title) : [...custom.hide, q.title]; saveCustom(); renderQuick(); });
          row.append(box, mk('span', null, q.title));
          pop.append(row);
        });
        if (custom.add.length) {
          pop.append(mk('h6', null, 'Added by you'));
          custom.add.forEach((label) => {
            const row = mk('label', 'ctb-row'); row.append(mk('span', null, '★'), mk('span', null, label));
            const x = mk('button', null, '×'); x.type = 'button'; x.title = 'Remove';
            x.addEventListener('click', () => { custom.add = custom.add.filter((l) => l !== label); saveCustom(); renderQuick(); closePop(); customize(btn); });
            row.append(x); pop.append(row);
          });
        }
        pop.append(mk('h6', null, 'Add a command'));
        const find = mk('input'); find.type = 'search'; find.placeholder = 'Type a command, like “print” or “bold”';
        const results = mk('div');
        const draw = () => {
          results.textContent = '';
          const found = search(find.value).filter((c) => !custom.add.includes(c.label)).slice(0, 7);
          if (!find.value.trim()) { results.append(mk('div', 'ctb-hint', 'Pick any command to keep it one click away at the top.')); return; }
          if (!found.length) { results.append(mk('div', 'ctb-hint', 'No command matches.')); return; }
          found.forEach((c) => {
            const b = mk('button', 'ctb-item'); b.type = 'button';
            b.append(mk('b', null, c.label)); if (c.path) b.append(mk('small', null, c.path));
            b.addEventListener('click', () => { custom.add = [...custom.add, c.label]; saveCustom(); renderQuick(); closePop(); cfg.toast && cfg.toast(`Added “${c.label}” to the top bar.`); });
            results.append(b);
          });
        };
        find.addEventListener('input', draw);
        pop.append(find, results);
        const reset = mk('button', 'ctb-item'); reset.type = 'button'; reset.append(mk('b', null, 'Reset to the standard buttons'));
        reset.addEventListener('click', () => { custom = { hide: [], add: [] }; saveCustom(); renderQuick(); closePop(); });
        pop.append(mk('hr'), reset);
        document.body.append(pop);
        const r = btn.getBoundingClientRect();
        pop.style.top = (r.bottom + 6) + 'px';
        pop.style.left = Math.max(8, Math.min(r.left - 20, innerWidth - pop.offsetWidth - 8)) + 'px';
        draw(); find.focus();
      }
      document.addEventListener('mousedown', (e) => { if (pop && !pop.contains(e.target) && !e.target.closest('.ctb-more')) closePop(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePop(); });

      // Middle: file name and save state
      const mid = mk('div', 'ctb-mid');
      const title = mk('span', 'ctb-title'), status = mk('span', 'ctb-status');
      mid.append(title, status);

      // Search over every command (menus and ribbon)
      const sw = mk('div', 'ctb-search');
      sw.innerHTML = svg('search');
      const input = mk('input'); input.type = 'search'; input.placeholder = 'Search commands';
      input.setAttribute('aria-label', 'Search for a command'); input.autocomplete = 'off'; input.spellcheck = false;
      sw.append(input, mk('span', 'ctb-kbd', 'Alt+Q'));
      let list = null, items = [], cur = 0;
      const RECENT = key + '-recent-commands';
      const recent = () => store.get(RECENT, []);
      const remember = (label) => store.set(RECENT, [label, ...recent().filter((x) => x !== label)].slice(0, 6));
      function commands() {
        const seen = new Set(), out = [];
        const fromMenus = cfg.menus ? cfg.menus().filter((m) => !m[2] || m[2]()).flatMap(([name, its]) => its.filter((it) => it && it !== '-' && !it.heading && it.run)
          .map((it) => ({ label: typeof it.label === 'function' ? it.label() : it.label, path: name + ' menu', key: it.key, run: it.run, disabled: it.disabled }))) : [];
        [...(cfg.getCommands ? cfg.getCommands() : []), ...fromMenus, ...(cfg.ribbon ? cfg.ribbon.commands() : [])].forEach((c) => {
          if (!c || !c.label || !c.run) return;
          const k = c.label + '|' + (c.path || '');
          if (!seen.has(k)) { seen.add(k); out.push(c); }
        });
        return out;
      }
      function search(q) {
        const all = commands();
        q = q.trim().toLowerCase();
        if (!q) return recent().map((l) => all.find((c) => c.label === l)).filter(Boolean);
        const words = q.split(/\s+/);
        return all.map((c) => {
          const label = c.label.toLowerCase(), hay = (label + ' ' + (c.path || '') + ' ' + (c.words || '')).toLowerCase();
          if (!words.every((w) => hay.includes(w))) return null;
          return [(label.startsWith(q) ? 0 : label.includes(q) ? 1 : 2) + (c.disabled && c.disabled() ? 3 : 0), c];
        }).filter(Boolean).sort((a, b) => a[0] - b[0] || a[1].label.length - b[1].label.length).slice(0, 14).map((x) => x[1]);
      }
      function close() { if (list) { list.remove(); list = null; } }
      function draw() {
        close();
        items = search(input.value); cur = 0;
        list = mk('div', 'ctb-list'); list.setAttribute('role', 'listbox');
        if (!input.value.trim()) list.append(mk('h6', null, items.length ? 'Recently used' : 'Type what you want to do, like “bold”, “print” or “save”'));
        if (input.value.trim() && !items.length) list.append(mk('div', 'ctb-empty', 'No command matches that. Try another word.'));
        items.forEach((c, i) => {
          const b = mk('button', 'ctb-item' + (i === 0 ? ' on' : '')); b.type = 'button'; b.setAttribute('role', 'option');
          const off = c.disabled && c.disabled();
          if (off) b.setAttribute('aria-disabled', 'true');
          b.append(mk('b', null, c.label));
          if (c.path) b.append(mk('small', null, c.path + (off ? ' · not available right now' : '')));
          if (c.key) b.append(mk('kbd', null, c.key));
          b.addEventListener('mousedown', (e) => e.preventDefault());
          b.addEventListener('click', () => runItem(i));
          b.addEventListener('mouseenter', () => mark(i));
          list.append(b);
        });
        sw.append(list);
      }
      function mark(i) { cur = i; [...list.querySelectorAll('.ctb-item')].forEach((b, j) => b.classList.toggle('on', j === i)); list.querySelectorAll('.ctb-item')[i]?.scrollIntoView({ block: 'nearest' }); }
      function runItem(i) {
        const c = items[i]; if (!c) return;
        if (c.disabled && c.disabled()) { cfg.toast && cfg.toast(`“${c.label}” is not available right now.`); return; }
        remember(c.label);
        close(); input.value = ''; input.blur();
        setTimeout(() => c.run(), 0);
      }
      input.addEventListener('focus', draw);
      input.addEventListener('input', draw);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') { e.preventDefault(); if (items.length) mark((cur + 1) % items.length); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); if (items.length) mark((cur - 1 + items.length) % items.length); }
        else if (e.key === 'Enter') { e.preventDefault(); runItem(cur); }
        else if (e.key === 'Escape') { e.preventDefault(); close(); input.value = ''; input.blur(); }
      });
      input.addEventListener('blur', () => setTimeout(close, 150));

      // Right: info, the app's own buttons (theme…), help
      const right = mk('div', 'ctb-right');
      const info = mk('div', 'ctb-info');
      right.append(info);
      (cfg.rightEls || []).filter(Boolean).forEach((e) => right.append(e));
      if (cfg.onHelp) {
        const h = mk('button', 'ctb-icon'); h.type = 'button'; h.innerHTML = svg('help'); h.title = 'Help'; h.setAttribute('aria-label', 'Help');
        h.addEventListener('click', cfg.onHelp);
        right.append(h);
      }
      bar.append(left, mid, sw, right);

      let lastInfo = '';
      function update() {
        title.textContent = cfg.getTitle ? cfg.getTitle() : cfg.appName;
        const st = cfg.getStatus ? cfg.getStatus() : null;
        status.textContent = st ? st.text : '';
        status.classList.toggle('dirty', !!(st && st.dirty));
        document.title = `${title.textContent} – ${cfg.appName}`;
        quickBtns.forEach(([b, q]) => { b.disabled = !!(q.disabled && q.disabled()); });
        const chips = (cfg.getInfo ? cfg.getInfo() : []).filter(Boolean);
        const sig = JSON.stringify(chips.map((c) => [c.text, c.title]));
        if (sig !== lastInfo) {
          lastInfo = sig; info.textContent = '';
          chips.forEach((c) => {
            const el = mk(c.run ? 'button' : 'span', 'ctb-chip', c.text);
            if (c.title) el.title = c.title;
            if (c.run) { el.type = 'button'; el.addEventListener('click', c.run); }
            info.append(el);
          });
        }
      }
      setInterval(update, 700);
      const focusSearch = () => { input.focus(); input.select(); };
      const altQ = (e) => { if (e.altKey && !e.ctrlKey && !e.metaKey && (e.key === 'q' || e.key === 'Q')) { e.preventDefault(); focusSearch(); } };
      document.addEventListener('keydown', altQ);

      (cfg.mount || document.body).prepend(bar);
      renderQuick();
      return { el: bar, update, focusSearch, listenTo: (doc) => doc.addEventListener('keydown', altQ), refreshQuick: renderQuick };
    };

    // =====================================================================
    // Ribbon: tabs of labelled buttons in named groups
    //   tabs: [{ id, label, hue, soft, onSelect, show, groups: [[label, [item…]]] }]
    //   item: { label, icon, run, big, iconOnly, title, key, pressed: () => bool, disabled: () => bool } | { col: [item…] } | { row: [item… or '|'] } | { el: element }
    // =====================================================================
    window.CraftRibbon = function (cfg) {
      const key = (cfg.storageKey || 'craft');
      const rb = mk('div', 'crb');
      const tabs = mk('div', 'crb-tabs'); tabs.setAttribute('role', 'tablist');
      const body = mk('div', 'crb-body');
      rb.append(tabs, body);
      const panels = {}, btns = {}, items = [];
      const isSoft = (hue) => hue + '1f';
      function makeItem(it, panel) {
        if (it.col) { const c = mk('div', 'crb-col'); it.col.forEach((x) => c.append(makeItem(x, panel))); return c; }
        // A row of buttons side by side (usually icon-only); '|' draws a divider.
        if (it.row) { const r = mk('div', 'crb-row'); it.row.forEach((x) => r.append(x === '|' ? mk('span', 'crb-sep') : makeItem(x, panel))); return r; }
        if (it.el) { const w = mk('div', 'crb-el'); w.append(typeof it.el === 'function' ? it.el() : it.el); return w; }
        const b = mk('button', it.big ? 'crb-big' : it.iconOnly ? 'crb-small crb-icon' : 'crb-small'); b.type = 'button';
        b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${it.icon || ''}</svg>`;
        // Icon-only buttons (bold, italic, alignment…) show their name as a tooltip, like Office.
        if (it.big) b.append(mk('span', null, it.label)); else if (it.iconOnly) b.setAttribute('aria-label', it.label); else b.append(document.createTextNode(it.label));
        b.title = (it.title || it.label) + (it.key ? ` (${it.key})` : '');
        b.addEventListener('mousedown', (e) => e.preventDefault());
        b.addEventListener('click', () => it.run(b));
        items.push({ it, b, panel });
        return b;
      }
      cfg.tabs.forEach((t) => {
        const b = mk('button', 'crb-tab', t.label); b.type = 'button'; b.setAttribute('role', 'tab');
        b.style.setProperty('--hue', t.hue || '#2f5bea');
        b.addEventListener('click', () => select(t.id, true));
        b.addEventListener('dblclick', toggle);
        tabs.append(b); btns[t.id] = b;
        const p = mk('div', 'crb-panel'); p.setAttribute('role', 'tabpanel'); p.hidden = true;
        p.style.setProperty('--hue', t.hue || '#2f5bea'); p.style.setProperty('--hue-soft', t.soft || isSoft(t.hue || '#2f5bea'));
        t.groups.forEach(([label, list]) => {
          const g = mk('div', 'crb-group'); g.setAttribute('role', 'group'); g.setAttribute('aria-label', label);
          const gb = mk('div', 'crb-gbody'); list.forEach((it) => gb.append(makeItem(it, t)));
          g.append(gb, mk('div', 'crb-label', label));
          p.append(g);
        });
        body.append(p); panels[t.id] = p;
      });
      const extra = mk('div', 'crb-extra');
      (cfg.extraEls || []).filter(Boolean).forEach((e) => extra.append(e));
      const col = mk('button', 'crb-collapse', '⌃'); col.type = 'button'; col.title = 'Hide or show the ribbon buttons (double-click a tab does the same)';
      col.addEventListener('click', toggle);
      tabs.append(extra, col);
      let current = null;
      function select(id, user) {
        const t = cfg.tabs.find((x) => x.id === id) || cfg.tabs[0];
        current = t.id;
        Object.entries(panels).forEach(([k, p]) => { p.hidden = k !== t.id; });
        Object.entries(btns).forEach(([k, b]) => b.setAttribute('aria-selected', k === t.id));
        if (user) { if (rb.classList.contains('collapsed')) toggle(); store.set(key + '-ribbon-tab', t.id); if (t.onSelect) t.onSelect(); }
        refresh();
      }
      function toggle() {
        const c = rb.classList.toggle('collapsed');
        col.textContent = c ? '⌄' : '⌃';
        store.set(key + '-ribbon-collapsed', c);
      }
      function refresh() {
        cfg.tabs.forEach((t) => { if (t.show) btns[t.id].hidden = !t.show(); });
        if (current && btns[current].hidden) select(cfg.tabs[0].id);
        items.forEach(({ it, b }) => {
          if (it.disabled) b.disabled = !!it.disabled();
          if (it.pressed) b.setAttribute('aria-pressed', String(!!it.pressed()));
        });
      }
      setInterval(refresh, 600);
      if (store.get(key + '-ribbon-collapsed', false)) toggle();
      if (cfg.after) cfg.after.after(rb); else (cfg.mount || document.body).prepend(rb);
      select(cfg.start || store.get(key + '-ribbon-tab', cfg.tabs[0].id));
      return {
        el: rb, select, refresh, current: () => current,
        commands: () => items.filter(({ panel }) => !panel.show || panel.show()).map(({ it, b, panel }) => ({
          label: it.label, path: `${panel.label} tab`, key: it.key, words: it.title || '', icon: it.icon && it.icon.length < 400 ? it.icon : '',
          run: () => { select(panel.id, true); it.run(b); }, disabled: it.disabled,
        })),
      };
    };
  })();

  // Title bar at the very top (Office style) and the ribbon under it. The ribbon tabs are ShiftCraft's
  // views (Schedule, Week, Forecast, Hand-off, Staff) plus Print & share; the logo opens every menu.
  // The old bar is hidden. Shared CraftTitlebar / CraftRibbon (pasted above, inside this script).
  if (window.CraftTitlebar && window.CraftRibbon) {
    const LOGO = `<svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="shc-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6fdd"/><stop offset=".55" stop-color="#2a86c4"/><stop offset="1" stop-color="#1e9e8a"/></linearGradient></defs><rect x="1" y="1" width="38" height="38" rx="11" fill="url(#shc-g)"/><rect x="8" y="10" width="24" height="20" rx="3.5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 16h24M14 7.5v5M26 7.5v5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="11" y="19.2" width="11" height="3.2" rx="1.6" fill="#fff"/><rect x="16" y="24.6" width="8.5" height="3.2" rx="1.6" fill="#fff" opacity=".85"/><path d="M28.5 21.5l1.2 2.8 2.8 1.2-2.8 1.2-1.2 2.8-1.2-2.8-2.8-1.2 2.8-1.2Z" fill="#ffe066"/></svg>`;
    const I = window.CraftIcons;
    const st = document.createElement('style');
    st.textContent = '.ctb { position: sticky; top: 0; z-index: 56; } body > .bar { display: none !important; } .crb .month-pick { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; } .crb .month-pick select { height: 28px; }';
    document.head.append(st);
    // Ribbon buttons reuse the menu commands, so both always do the same thing.
    const all = () => MENUS.flatMap((m) => m[1]).filter((it) => it && it.label);
    const item = (start) => all().find((it) => it.label === start) || all().find((it) => it.label.startsWith(start)) || {};
    const C = (start, label, icon, o = {}) => { const it = item(start); return { label: label || it.label, icon, key: it.key, run: () => it.run && it.run(), ...o }; };
    const VIEWS = ['schedule', 'week', 'forecast', 'handoff', 'staff', 'company'];
    const view = (id) => () => { if (ui.tab !== id) { ui.tab = id; persist(); render(); } };
    const ribbon = window.CraftRibbon({
      mount: document.body, storageKey: 'shiftcraft', start: VIEWS.includes(ui.tab) ? ui.tab : 'schedule',
      tabs: [
        { id: 'schedule', label: 'Schedule', hue: '#2f6fdd', onSelect: view('schedule'), groups: [
          ['Day', [C('Copy a day', 'Copy day…', I.copy, { big: true }), { col: [C('Copy this day to several', 'Copy to several days…', I.severalDays), C('Clear day', 'Clear day', I.clear)] }]],
          ['Week', [{ col: [C('Previous week', 'Previous week', I.prev), C('Next week', 'Next week', I.next), C('Move week', 'Move week…', I.move)] }, { col: [C('Copy a week', 'Copy week…', I.copy), C('Clear week', 'Clear week', I.clear)] }]],
          ['Month', [{ el: document.querySelector('.month-pick') }, { col: [C('Copy a month', 'Copy month…', I.copy), C('Clear month', 'Clear month', I.clear), C('Move whole plan', 'Move plan…', I.move)] }]],
          ['Check', [C('Check schedule', 'Check schedule', I.check, { big: true }), C('Undo', 'Undo', I.undo, { big: true })]],
        ] },
        { id: 'week', label: 'Week', hue: '#1e9e8a', onSelect: view('week'), groups: [
          ['This week', [C('Print or save week table', 'Week table', I.table, { big: true }), C('Save this week’s schedule only', 'Save week', I.save, { big: true }), C('Copy a week', 'Copy week…', I.copy, { big: true })]],
          ['Check', [C('Check schedule', 'Check schedule', I.check, { big: true })]],
        ] },
        { id: 'forecast', label: 'Forecast', hue: '#e09f1f', onSelect: view('forecast'), groups: [
          ['Settings', [C('Settings', 'Settings…', I.gear, { big: true, title: 'Sales per labor hour, AM / MID / PM times, plan length' }), C('Company & location', 'Company & location', I.store, { big: true })]],
        ] },
        { id: 'handoff', label: 'Hand-off', hue: '#7b4fd6', onSelect: view('handoff'), groups: [
          ['Hand-off', [C('Print…', 'Print this list', I.print, { big: true }), C('Save as text or CSV', 'Text or CSV', I.textFile, { big: true }), C('Print screen', 'Print screen', I.screen, { big: true })]],
        ] },
        { id: 'staff', label: 'Staff', hue: '#d1408a', onSelect: view('staff'), groups: [
          ['Team', [C('Save team only', 'Save team', I.save, { big: true }), C('Open', 'Open a team file', I.folder, { big: true }), C('Print schedule for a person', 'Print for a person', I.person, { big: true })]],
          ['New hires', [C('New-hire checklist', 'New-hire checklist', I.checklist, { big: true })]],
        ] },
        { id: 'company', label: 'Company & Location', hue: '#c2711d', onSelect: view('company'), groups: [
          ['Location', [{ label: 'Details', icon: I.store, big: true, title: 'Company, location, address, phone, email, website, opening hours', run: () => { view('company')(); setTimeout(() => { const x = document.querySelector('#co-company'); x && x.focus(); }, 50); } }, C('Save location', 'Save everything', I.save, { big: true, title: 'Save the whole location: team, schedule, positions and settings' })]],
          ['Positions', [{ label: 'Add a position', icon: I.checklist, big: true, run: () => { view('company')(); setTimeout(() => { const x = document.querySelector('#co-newpos'); x && x.focus(); }, 50); } }]],
        ] },
        { id: 'share', label: 'Print & share', hue: '#138a9e', groups: [
          ['Print or save pictures', [C('Print or save week table', 'Week table', I.table, { big: true }), C('Print or save visual timeline', 'Timeline', I.timeline, { big: true }), C('Print or save calendar', 'Calendar', I.calendar, { big: true }), C('Print schedule for a person', 'Person or group', I.person, { big: true }), C('Print availability and contact list', 'Availability list', I.table, { big: true, title: 'Everyone’s phone, positions trained, day-by-day availability and validated, on one landscape page' }), C('Print screen', 'Print screen', I.screen, { big: true })]],
          ['Share', [C('Email or share', 'Email or share', I.mail, { big: true }), C('Save emailable file', 'Emailable file', I.share, { big: true })]],
          ['Save', [C('Save…', 'Save…', I.save, { big: true }), { col: [C('Save month', 'Save month', I.save), C('Save location', 'Save everything', I.save), C('Save as text or CSV', 'Text or CSV', I.textFile)] }]],
        ] },
      ],
    });
    // Keep the ribbon on the view you are looking at (views also change from links inside the page).
    setInterval(() => { if (VIEWS.includes(ui.tab) && ribbon.current() !== ui.tab && ribbon.current() !== 'share') ribbon.select(ui.tab); }, 400);
    const help = (MENUS.find(([n]) => n === 'Help') || [, []])[1].find((it) => it && it.run);
    window.CraftTitlebar({
      appName: 'ShiftCraft', storageKey: 'shiftcraft', colors: ['#2f6fdd', '#1e9e8a'],
      mount: document.body, toast: (m) => toast(m), logo: LOGO, menus: () => MENUS, ribbon,
      quick: [
        { icon: 'save', title: 'Save everything (team, availability, schedules and settings)', key: 'Ctrl+S', run: () => saveFile('location') },
        { icon: 'undo', title: 'Undo', key: 'Ctrl+Z', run: undo, disabled: () => !undoStack.length },
        { icon: 'print', title: 'Print or save: week table, timeline, calendar or the availability and contact list', run: () => exportImageDialog({ layout: 'table' }) },
        { icon: 'export', title: 'Email or share', run: emailDialog },
        { icon: 'check', title: 'Check the schedule', run: checkDialog },
      ],
      getTitle: () => ui.fileName || placeName(),
      getStatus: () => ({ text: plan.example ? 'Example data · autosaves in this browser' : 'Autosaves in this browser' }),
      getInfo: () => [
        { text: placeName(), title: 'Company and location (click to change)', run: () => { ui.tab = 'company'; persist(); render(); } },
        { text: 'Week of ' + shortDate(weekDays(weekOf(ui.day))[0]), title: 'The week you are working on' },
      ],
      rightEls: [document.getElementById('theme-btn')],
      onHelp: help ? help.run : null,
    });
    const ic = document.createElement('link'); ic.rel = 'icon';
    ic.href = 'data:image/svg+xml,' + encodeURIComponent(LOGO.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" '));
    document.head.append(ic);
  }

  render();
  started = true;
  checkEmbedded();
})();
</script>
</body>
</html>
